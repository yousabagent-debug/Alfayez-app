<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الفايز للزيوت والشحومات</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0c2b21">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شاشة البداية (Splash) -->
    <div id="splash-screen" class="splash">
        <img src="logo.jpg" alt="Al-Fayez Logo" id="splash-logo">
    </div>

    <!-- التطبيق الأساسي -->
    <div id="app" class="hidden">
        <header id="main-header">
            <div class="header-brand">
                <img src="logo.jpg" alt="Logo">
                <div>
                    <h1>الفايز للزيوت</h1>
                    <span id="branch-name">اختيار الفرع</span>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="icon-btn" onclick="openSettings()">⚙️</button>
                <button class="icon-btn" onclick="logout()" style="color: var(--danger);">🚪</button>
            </div>
        </header>

        <main id="main-content"></main>

        <nav id="bottom-nav" class="bottom-nav hidden"></nav>
    </div>

    <script src="db.js"></script>
    <script src="app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
