<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الفايز للزيوت والشحومات</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شاشة البداية (Splash) -->
    <div id="splash-screen" class="splash">
        <img src="splash.jpg" alt="Al-Fayez Splash">
    </div>

    <div id="app" class="hidden">
        <header id="main-header">
            <div class="header-brand">
                <img src="logo.jpg" alt="Logo">
                <div>
                    <h1>الفايز للزيوت</h1>
                </div>
            </div>
            <div style="display: flex; gap: 5px; align-items: center;">
                <!-- أيقونة الجرس للإشعارات مع عداد -->
                <button class="icon-btn" onclick="openNotificationsModal()" title="الإشعارات" style="position: relative;">
                    🔔
                    <span id="notif-badge" style="position: absolute; top: 2px; right: 2px; background: red; color: white; border-radius: 50%; font-size: 0.6rem; padding: 1px 5px; display: none;">0</span>
                </button>
                <button class="icon-btn" onclick="navigate('branches')" title="الفروع">🔙</button>
                <button class="icon-btn" onclick="openSettings()">⚙️</button>
                <button class="icon-btn" onclick="logout()" style="color: var(--danger);">🚪</button>
            </div>
        </header>

        <main id="main-content"></main>

        <nav id="bottom-nav" class="bottom-nav hidden"></nav>
    </div>

    <script src="db.js"></script>
    <script src="lang.js"></script>
    <script src="settings.js"></script>
    <script src="login.js"></script>
    <script src="branches.js"></script>
    <script src="admin.js"></script>
    <script src="pages/dashboard.js"></script>
    <script src="pages/goods.js"></script>
    <script src="pages/shifts.js"></script>
    <script src="pages/invoice.js"></script>
    <script src="pages/supplies.js"></script>
    <script src="pages/expenses.js"></script>
    <script src="pages/reports.js"></script>
    <script src="pages/employee-settings.js"></script>
    <script src="app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
        }
    </script>

    <script>
        window.onerror = function(msg, url, line) { alert('حدث خطأ: ' + msg + ' في السطر ' + line); };
    </script>

</body>
</html>
